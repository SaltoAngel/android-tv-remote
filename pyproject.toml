[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "android-tv-remote"
version = "1.0.0"
description = "GNOME TV remote control over ADB TCP (port 5555)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
dependencies = [
  "adb-shell>=0.4.4",
  "psutil>=5.9.0",
  "rsa>=4.9",
  "pyasn1>=0.5.1",
]

[project.scripts]
android-tv-remote = "gnome_adb_tv_remote.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


