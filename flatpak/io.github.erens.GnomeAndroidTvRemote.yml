app-id: io.github.erens.GnomeAndroidTvRemote
runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
command: gnome-adb-tv-remote

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --device=all  # For USB ADB access

build-options:
  env:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_NO_CACHE_DIR: "1"
    PYTHONNOUSERSITE: "1"

modules:
  # libusb for USB device access
  - name: libusb
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-udev
    sources:
      - type: archive
        url: https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2
        sha256: ffaa41d741a8a3bee244ac8e54a72ea05bf2879571c6f8e9166f8e4e0da80391

  # FFmpeg (minimal build for scrcpy)
  - name: ffmpeg
    buildsystem: autotools
    config-opts:
      - --disable-doc
      - --disable-programs
      - --disable-static
      - --enable-shared
      - --disable-encoders
      - --disable-muxers
      - --disable-devices
      - --disable-hwaccels
      - --disable-filters
      - --enable-decoder=h264
      - --enable-decoder=hevc
      - --enable-decoder=av1
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.0.2.tar.xz
        sha256: 8646515b638a3ad303e23af6a3f068e621ec2d498f1d07a82e356f4b5a29b2a0
    cleanup:
      - /share/ffmpeg

  # scrcpy for low-latency input injection
  - name: scrcpy
    buildsystem: meson
    config-opts:
      - -Db_lto=true
      - -Dprebuilt_server=/app/share/scrcpy/scrcpy-server
    sources:
      - type: archive
        url: https://github.com/Genymobile/scrcpy/archive/refs/tags/v3.1.tar.gz
        sha256: c4c5bbb2fd63e3c6b4ccd28f4dcb1138a6b8d8c4a1ad13e6dc14582c55e86c15
        dest: scrcpy-src
      - type: file
        url: https://github.com/Genymobile/scrcpy/releases/download/v3.1/scrcpy-server-v3.1
        sha256: 5cc33a7bc8c1176c5be18a78a47f8e0e0ea4e7a033e3d8237d7f0ec7ce2fb42b
        dest-filename: scrcpy-server
    post-install:
      - install -Dm644 scrcpy-server /app/share/scrcpy/scrcpy-server
    subdir: scrcpy-src
  - name: python3-psutil
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation psutil-5.9.8.tar.gz
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/90/c7/6dc0a455d111f68ee43f27793971cf03fe29b6ef972042549db29eec39a2/psutil-5.9.8.tar.gz
        sha256: 6be126e3225486dff286a8fb9a06246a5253f4c7c53b475ea5f5ac934e64194c

  - name: python3-adb-shell
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation adb_shell-0.4.4.tar.gz
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/8f/73/d246034db6f3e374dad9a35ee3f61345a6b239d4febd2a41ab69df9936fe/adb_shell-0.4.4.tar.gz
        sha256: 04c305f30a2ca25d5c54b3cd6ce9bb64c36e5f07967b23b3fb6aaecc851b90b6

  - name: python3-pyasn1
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation pyasn1-0.6.1-py3-none-any.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/c8/f1/d6a797abb14f6283c0ddff96bbdd46937f64122b8c925cab503dd37f8214/pyasn1-0.6.1-py3-none-any.whl
        sha256: 0d632f46f2ba09143da3a8afe9e33fb6f92fa2320ab7e886e2d0f7672af84629

  - name: python3-rsa
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation rsa-4.9.1-py3-none-any.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/64/8d/0133e4eb4beed9e425d9a98ed6e081a55d195481b7632472be1af08d2f6b/rsa-4.9.1-py3-none-any.whl
        sha256: 68635866661c6836b8d39430f97a996acbd61bfa49406748ea243539fe239762

  - name: gnome-adb-tv-remote
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation .
      - install -D data/io.github.erens.GnomeAndroidTvRemote.desktop /app/share/applications/io.github.erens.GnomeAndroidTvRemote.desktop
      - install -D data/io.github.erens.GnomeAndroidTvRemote.metainfo.xml /app/share/metainfo/io.github.erens.GnomeAndroidTvRemote.metainfo.xml
      - install -D data/icons/hicolor/scalable/apps/io.github.erens.GnomeAndroidTvRemote.svg /app/share/icons/hicolor/scalable/apps/io.github.erens.GnomeAndroidTvRemote.svg
      - install -D data/io.github.erens.GnomeAndroidTvRemote.gschema.xml /app/share/glib-2.0/schemas/io.github.erens.GnomeAndroidTvRemote.gschema.xml
      - glib-compile-schemas /app/share/glib-2.0/schemas
    sources:
      - type: dir
        path: ..


